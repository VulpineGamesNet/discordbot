# Copy to config.toml and fill in.
#
# Structural config lives here. Secrets come from the environment (or .env)
# through ${VAR} placeholders - a missing ${VAR} is a hard startup error.
# To write a literal "$" in a value, escape it as "$$".
#
# Values below mirror the live Vulpine deployment, with channel ids replaced by
# placeholders. Everything here is safe to commit; nothing is a secret.

[discord]
token = "${DISCORD_TOKEN}"
# Optional. With a guild id, slash commands appear instantly in that server.
# Omit it for a global sync (can take up to an hour to propagate).
guild_id = 123456789012345678
# Optional. Discord user DMed when a server stays offline past
# down_alert_after. Right-click your name with Developer Mode on to copy the id.
# The bot can only DM someone who shares a server with it. Omit it and the
# alert is only written to the log.
alert_user_id = 123456789012345678

# Optional. Enables /restart and /restart-cancel. The bot restarts a server
# through the panel's client API, so it needs a client API key from an account
# that can see every server below. Leave the table out to disable the module;
# an empty api_key is a startup error, not "disabled".
# [pterodactyl]
# url     = "https://panel.example.com"
# api_key = "${PTERODACTYL_API_KEY}"

# Applied to every [[servers]] block. Any key here may be overridden per server.
[defaults]
stats_check_interval = 5     # RCON getstats poll, seconds
events_poll_interval = 2     # discord_events DB poll, seconds
max_message_length   = 256   # truncation before relaying to Minecraft
offline_threshold    = 12    # consecutive failed stat checks before "restarting..."
status_cooldown      = 30    # min seconds between online/offline embeds
down_alert_after     = 300   # seconds offline before the owner is DMed
icon_url = "https://raw.githubusercontent.com/VulpineGamesNet/discordbot/main/resources/vulpines.png"

# One block per Minecraft server. Each needs its own Discord channel and its
# own MySQL database - the discord_events table is not shared between servers.
#
# `name` is the display name: embeds, webhook username, presence and log prefix.
# It should match `server_name` in that server's kubejs/config/discord.json.
#
# `rcon_host` is resolved by Docker DNS on the shared network. Under Pterodactyl
# the container is named after the server UUID, so that UUID is the hostname.
[[servers]]
name          = "Vulpine ATM10"
channel_id    = 111111111111111111
rcon_host     = "284c8202-2eb5-4ba2-b7b9-519145422945"
rcon_port     = 25575
rcon_password = "${ATM10_RCON_PASSWORD}"
database_url  = "${ATM10_DATABASE_URL}"     # jdbc:mysql:// and mysql:// both accepted
# Optional. Path *inside this container* to the server's latest.log. When set,
# a crash is announced the moment the server writes about it, with the reason,
# instead of waiting for RCON to stop answering. docker-compose mounts the log
# directory read-only - mount the directory, never the file, or log rotation
# strands the reader on the old inode.
log_path      = "/app/serverlogs/atm10/latest.log"
# Optional. Path *inside this container* to the server's RCON pause flag. While
# it reads {"shutdown": true} the bot sends no RCON at all, so the server can
# stop without a command in flight parking its RCON thread and hanging the stop
# until wings kills it. The votifier reads the same file. /restart writes it
# (true before the power signal, false once the old process is gone), so the
# directory must be mounted writable; a read-only mount is logged and the
# restart goes ahead unpaused. It fails open when missing or malformed. Same
# directory-not-file mount rule as log_path. Omit to never pause.
pause_flag    = "/app/flags/atm10/shutdown.json"
# Optional. Pterodactyl server id (short id or uuid) for /restart. Defaults to
# rcon_host, which under Pterodactyl already is the server uuid.
# pterodactyl_id = "284c8202-2eb5-4ba2-b7b9-519145422945"
# webhook_url = "${ATM10_WEBHOOK_URL}"      # only if the bot lacks MANAGE_WEBHOOKS
# icon_url    = "https://example.com/atm10.png"   # overrides [defaults].icon_url

[[servers]]
name          = "Vulpine DC"
channel_id    = 222222222222222222
rcon_host     = "70aeb1c6-a11a-4ad9-90bc-bc3590e0f0d0"
rcon_port     = 25575
rcon_password = "${DECEASEDCRAFT_RCON_PASSWORD}"
database_url  = "${DECEASEDCRAFT_DATABASE_URL}"
log_path      = "/app/serverlogs/dc/latest.log"
# offline_threshold decides whether the server going down is noticed at all: the
# bot waits this many check intervals of silence before announcing a restart, so
# a server back on its feet sooner than that window is never reported as down. DC
# boots in ~20s, so the default 12 (60s) stayed silent; 4 (20s) catches it while
# still ignoring a single dropped RCON packet.
#
# status_cooldown only throttles repeated *alerts*. The all-clear that resolves
# an announced outage is never withheld, whatever this is set to - a suppressed
# recovery leaves the channel claiming the server is still down.
#
# down_alert_after is a different kind of number: not "is it down" but "is it
# staying down". Wings restarts a crashed server on its own in about three
# minutes, so the DM is only worth sending once that has visibly failed. It is
# counted from the offline mark, not from the first failed check, so slow
# detection on a wedged server does not eat the grace period.
offline_threshold = 4
status_cooldown   = 10
