# Copy to config.toml and fill in.
#
# Structural config lives here. Secrets come from the environment (or .env)
# through ${VAR} placeholders - a missing ${VAR} is a hard startup error.
# To write a literal "$" in a value, escape it as "$$".
#
# Values below mirror the live Vulpine deployment, with channel ids replaced by
# placeholders. Everything here is safe to commit; nothing is a secret.

[discord]
token = "${DISCORD_TOKEN}"
# Optional. With a guild id, slash commands appear instantly in that server.
# Omit it for a global sync (can take up to an hour to propagate).
guild_id = 123456789012345678

# Applied to every [[servers]] block. Any key here may be overridden per server.
[defaults]
stats_check_interval = 5     # RCON getstats poll, seconds
events_poll_interval = 2     # discord_events DB poll, seconds
max_message_length   = 256   # truncation before relaying to Minecraft
offline_threshold    = 12    # consecutive failed stat checks before "restarting..."
status_cooldown      = 30    # min seconds between online/offline embeds
icon_url = "https://raw.githubusercontent.com/VulpineGamesNet/discordbot/main/resources/vulpines.png"

# One block per Minecraft server. Each needs its own Discord channel and its
# own MySQL database - the discord_events table is not shared between servers.
#
# `name` is the display name: embeds, webhook username, presence and log prefix.
# It should match `server_name` in that server's kubejs/config/discord.json.
#
# `rcon_host` is resolved by Docker DNS on the shared network. Under Pterodactyl
# the container is named after the server UUID, so that UUID is the hostname.
[[servers]]
name          = "Vulpine ATM10"
channel_id    = 111111111111111111
rcon_host     = "284c8202-2eb5-4ba2-b7b9-519145422945"
rcon_port     = 25575
rcon_password = "${ATM10_RCON_PASSWORD}"
database_url  = "${ATM10_DATABASE_URL}"     # jdbc:mysql:// and mysql:// both accepted
# webhook_url = "${ATM10_WEBHOOK_URL}"      # only if the bot lacks MANAGE_WEBHOOKS
# icon_url    = "https://example.com/atm10.png"   # overrides [defaults].icon_url

[[servers]]
name          = "Vulpine DC"
channel_id    = 222222222222222222
rcon_host     = "70aeb1c6-a11a-4ad9-90bc-bc3590e0f0d0"
rcon_port     = 25575
rcon_password = "${DECEASEDCRAFT_RCON_PASSWORD}"
database_url  = "${DECEASEDCRAFT_DATABASE_URL}"
# Tune this to the server's boot time. The bot only announces a restart once it
# has seen offline_threshold consecutive failures, so a server that comes back
# faster than that window is never reported as down at all. This one boots in
# ~20s, so the default 12 (60s) stayed silent; 4 (20s) catches it while still
# ignoring a single dropped RCON packet.
offline_threshold = 4
