services:
  discord-bot:
    build: .
    container_name: minecraft-discord-bot
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - .env
    # Non-root, and matching the Pterodactyl uid so the read-only log mounts
    # below are readable. config.toml holds no secrets, only ${VAR}
    # placeholders the process resolves from .env itself.
    user: "997:988"
    volumes:
      # Mounted, not baked into the image: adding or editing a server is a
      # restart, not a rebuild.
      - ./config.toml:/app/config.toml:ro
      # Server logs, read-only, for crash detection. A crash appears here the
      # moment it happens and says why, where RCON only reveals it once the
      # server stops answering - minutes later during an out-of-memory death.
      #
      # Mount the DIRECTORY, never latest.log itself: a single-file bind mount
      # pins the inode, so after the server rotates the log on restart the
      # container would keep reading the old, frozen file forever.
      - /var/lib/pterodactyl/volumes/284c8202-2eb5-4ba2-b7b9-519145422945/logs:/app/serverlogs/atm10:ro
      - /var/lib/pterodactyl/volumes/70aeb1c6-a11a-4ad9-90bc-bc3590e0f0d0/logs:/app/serverlogs/dc:ro
      # RCON pause flag, read-only. ATM10 sets it just before it stops so every
      # RCON client goes quiet first; otherwise a command in flight parks the
      # server's RCON thread and the stop hangs until wings kills it. Same
      # directory the votifier mounts. DC has no flag and never pauses.
      #
      # DIRECTORY, not the file, for the same inode reason as the logs above -
      # and here it is not hypothetical: a pack update recreated this directory
      # on 2026-08-26 and the votifier's mount went on reading the orphaned
      # inode for ten days without a single error line.
      - /var/lib/pterodactyl/volumes/284c8202-2eb5-4ba2-b7b9-519145422945/votifier_flags:/app/flags/atm10:ro
    networks:
      - pterodactyl_nw

# Use external Pterodactyl network for RCON access
networks:
  pterodactyl_nw:
    external: true
